services:
  radioproxy:
    image: ghcr.io/amsound/radioproxy:latest
    container_name: radioproxy
    init: true
    ports:
      - "8010:8010"
    volumes:
      - ./radioproxy-data:/data          # captures of what each listener was last sent
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
